# Builds the app and publishes it to GitHub Pages.
#
# One-time setup (see docs/deployment.md):
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Optional (accounts + sync): Settings → Secrets and variables → Actions →
#      Variables: SUPABASE_URL and SUPABASE_ANON_KEY (both are public values).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Stable app at <base>, beta app (features flagged "beta" switched on,
        # own local database) at <base>beta/. Same server and accounts.
        run: |
          npm run build
          VITE_CHANNEL=beta VITE_BASE_PATH="${VITE_BASE_PATH}beta/" npx vite build --outDir dist-beta
          mv dist-beta dist/beta
        env:
          # Project sites are served from /<repository>/.
          # Custom domain (e.g. remcraft.example.com): set the repository variable
          # BASE_PATH to "/". Default: GitHub Pages project path /<repo>/.
          VITE_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Operator details for Impressum and privacy policy (repository variables,
          # so they never have to be committed). Address lines separated by "|".
          VITE_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          VITE_LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          VITE_LEGAL_DATA_REGION: ${{ vars.LEGAL_DATA_REGION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
